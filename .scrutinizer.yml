checks:
  php: true

build:
  environment:
    php:
      version: "8.3.33"
      compile_options: "--without-pear"
      pecl_extensions: []
  nodes:
    services-tests:
      commands:
        - checkout-code ~/build
        - cd ~/build && sh prepare-test-runtime.sh
        - cd ~/build && composer install -o --no-interaction --no-progress --prefer-dist
        - command: cd ~/build && sh scrutinizer-tests.sh
          idle_timeout: 1200

filter:
  excluded_paths:
    - src/bin/*
    - src/command/*
    - src/tests/*
    - src/public/*
    - src/templates/*
    - locale/*
    - cache/*
    - config/*
    - logs/*
    - vendor/*
