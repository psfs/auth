checks:
  php: true

build:
  tests:
    override:
      - sh scrutinizer-tests.sh
  environment:
    php:
      version: "8.3.33"
  dependencies:
    before:
      - sh prepare-test-runtime.sh

filter:
  excluded_paths:
    - src/bin/*
    - src/command/*
    - src/tests/*
    - src/public/*
    - src/templates/*
    - locale/*
    - cache/*
    - config/*
    - logs/*
    - vendor/*
