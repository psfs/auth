checks:
  php: true

build:
  environment:
    docker: true
    variables:
      PHP_VERSION: "8.3"
      DEBUG: "-xdebug"
  commands:
    - checkout-code ~/build
    - cd ~/build && docker-compose up -d php redis
    - cd ~/build && docker-compose exec -T php composer install -o --no-interaction --no-progress --prefer-dist
    - command: cd ~/build && docker-compose exec -T php sh scrutinizer-tests.sh
      idle_timeout: 1200

filter:
  excluded_paths:
    - src/bin/*
    - src/command/*
    - src/tests/*
    - src/public/*
    - src/templates/*
    - locale/*
    - cache/*
    - config/*
    - logs/*
    - vendor/*
